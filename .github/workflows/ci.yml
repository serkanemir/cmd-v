name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Swift
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Strict concurrency check
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency

      - name: Test
        run: swift test

      - name: Release build
        run: swift build -c release
